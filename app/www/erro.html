<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Supervisor Lube — sem conexão</title>
<style>
  html, body { margin: 0; height: 100%; background: #050b1c; color: #f4f7ff; font: 500 15px/1.45 system-ui, sans-serif; }
  body { display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
  .placa { background: #fff; border-radius: 14px; padding: 8px 12px; display: inline-block; box-shadow: 0 0 0 1px rgba(233,200,119,.42); }
  .placa img { height: 44px; display: block; }
  h1 { font-size: 20px; margin: 22px 0 6px; }
  p { color: #aec0e2; max-width: 32ch; margin: 0 auto 20px; }
  button { height: 46px; border: 0; border-radius: 12px; background: #e5202c; color: #fff; font: 700 15px system-ui, sans-serif; padding: 0 22px; }
</style>
</head>
<body>
  <div>
    <span class="placa"><img src="logo-lube.png" alt="Lube"></span>
    <h1>Sem conexão</h1>
    <p>Não consegui abrir o Supervisor Lube. Confira a internet do celular e tente de novo.</p>
    <button type="button" onclick="location.replace('https://supervisor-lube.vercel.app/')">Tentar de novo</button>
  </div>
</body>
</html>
